[project]
name = "cavemem"
version = "0.1.0"
description = "CAVE-Mem research framework for replay-verified memory interventions"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.12.5",
    "shortuuid>=1.0.13",
    "typer>=0.23.0",
    "requests>=2.32.5",
    "pyyaml>=6.0.3",
    "rich>=14.3.2",
    "tenacity>=9.1.4",
    "python-dotenv>=1.2.1",
    "litellm>=1.81.11",
    "jinja2>=3.1.6",
    "pandas>=2.3.3",
    "pyarrow>=17.0.0",
    "toml>=0.10.2",
    "omegaconf>=2.3.0",
    "numpy>=1.26",
    "filelock>=3.13",
]

[project.optional-dependencies]
actor = [
    "torch>=2.4",
    "transformers>=4.53,<5",
    "tokenizers>=0.21",
    "safetensors>=0.4",
]

[project.scripts]
memory-agent = "memory_agent.cli:app"
cave-collect = "memory_agent.cave.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_agent"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
